<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>rayDE</title>
	<meta name="description" content="rayDE - code editor built on raylib, running in the browser via WebAssembly.">
	<style>
		:root {
			--bg:     #1e1f22;
			--panel:  #2b2d31;
			--text:   #d4d4d4;
			--dim:    #8a8f98;
			--accent: #4fa3ff;
		}
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.4 ui-monospace, "JetBrains Mono", Consolas, monospace;
		}
		#canvas {
			display: block;
			border: 0;
			outline: none;
		}
		#overlay {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			background: var(--bg);
			z-index: 2;
		}
		#overlay h1 {
			margin: 0;
			font-size: 28px;
			font-weight: 600;
			letter-spacing: 0.02em;
		}
		#status { color: var(--dim); }
		#progress {
			width: 240px;
			height: 4px;
			appearance: none;
			border: 0;
			background: var(--panel);
		}
		#progress::-webkit-progress-bar   { background: var(--panel); }
		#progress::-webkit-progress-value { background: var(--accent); }
		#progress::-moz-progress-bar      { background: var(--accent); }
		#toolbar {
			position: fixed;
			right: 12px;
			bottom: 44px;
			display: flex;
			gap: 6px;
			opacity: 0.35;
			transition: opacity 0.15s;
			z-index: 1;
		}
		#toolbar:hover { opacity: 1; }
		#toolbar a, #toolbar button {
			font: inherit;
			font-size: 12px;
			color: var(--text);
			background: var(--panel);
			border: 1px solid #3c3f45;
			border-radius: 4px;
			padding: 4px 8px;
			text-decoration: none;
			cursor: pointer;
		}
		#toolbar a:hover, #toolbar button:hover { border-color: var(--accent); }
	</style>
</head>
<body>
	<div id="overlay">
		<h1>rayDE</h1>
		<div id="status">Downloading...</div>
		<progress id="progress" value="0" max="100"></progress>
	</div>

	<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

	<div id="toolbar">
		<button id="download" title="Download the edited file (Ctrl+S saves it first)">Download main.c</button>
		<a href="https://github.com/rygo6/raymacs" target="_blank" rel="noopener">GitHub</a>
	</div>

	<script>
		const statusEl   = document.getElementById('status');
		const progressEl = document.getElementById('progress');
		const overlayEl  = document.getElementById('overlay');
		const canvasEl   = document.getElementById('canvas');

		// Keep editor shortcuts (Ctrl/Alt combos, Tab, Backspace, arrows) from
		// triggering browser actions. F-keys and devtools stay with the browser.
		const passthroughKeys = new Set(['F5', 'F11', 'F12']);
		const editorKeys = new Set(['Tab', 'Backspace', ' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown', 'Alt']);
		window.addEventListener('keydown', (e) => {
			if (passthroughKeys.has(e.key)) return;
			if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') return;
			if (e.ctrlKey || e.altKey || editorKeys.has(e.key)) e.preventDefault();
		}, true);
		// Alt alone toggles the menu bar in some browsers.
		window.addEventListener('keyup', (e) => { if (e.key === 'Alt') e.preventDefault(); }, true);

		document.getElementById('download').addEventListener('click', () => {
			const data = Module.FS.readFile('src/main.c');
			const url  = URL.createObjectURL(new Blob([data], { type: 'text/x-c' }));
			const a    = document.createElement('a');
			a.href = url;
			a.download = 'main.c';
			a.click();
			URL.revokeObjectURL(url);
			canvasEl.focus();
		});

		var Module = {
			canvas: canvasEl,
			print:    (text) => console.log(text),
			printErr: (text) => console.error(text),
			setStatus: (text) => {
				const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
				if (m) {
					statusEl.textContent = m[1].trim();
					progressEl.value = parseInt(m[2]) * 100;
					progressEl.max   = parseInt(m[4]) * 100;
				} else if (text) {
					statusEl.textContent = text;
				}
			},
			monitorRunDependencies: (left) => {
				Module.setStatus(left ? 'Preparing...' : 'Running...');
			},
			postRun: [() => {
				overlayEl.remove();
				// raylib only sizes the canvas to the window on resize events.
				window.dispatchEvent(new Event('resize'));
				canvasEl.focus();
			}],
		};

		window.addEventListener('error', () => {
			statusEl.textContent = 'Error: see the browser console.';
		});
	</script>
	{{{ SCRIPT }}}
</body>
</html>
